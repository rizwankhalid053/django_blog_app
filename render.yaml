services:
  - type: web
    name: django-blog-app
    runtime: python
    buildCommand: 'pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate'
    startCommand: 'gunicorn myproject.wsgi:application'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: DATABASE_URL
        value: 'PASTE_YOUR_ACTUAL_SUPABASE_CONNECTION_URI_HERE'
      - key: ALLOWED_HOSTS
        value: '*'
